<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parametric Poster Generator — Making Time 17 (Advanced Flora & Labels)</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&family=Foldit:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne+Mono&display=swap" rel="stylesheet">

  <!-- jsPDF & svg2pdf.js for vector-preserving PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg2pdf.js@2.8.1/dist/svg2pdf.umd.min.js"></script>

  <style>
    :root {
      --bg-dark: #0a0c10;
      --panel-bg: #14171d;
      --panel-border: #222733;
      --accent: #00e5ff;
      --text-main: #e0e6ed;
      --text-muted: #8895a7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Controls */
    #sidebar {
      width: 400px;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--panel-border);
    }

    .sidebar-header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .sidebar-content {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .control-group {
      margin-bottom: 24px;
    }

    .control-group h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-preset {
      padding: 8px 4px;
      font-size: 0.75rem;
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      background: #0a0c10;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-preset:hover {
      border-color: var(--accent);
    }

    label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    input[type="text"], textarea, select {
      width: 100%;
      background: #0a0c10;
      border: 1px solid var(--panel-border);
      color: #fff;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-family: inherit;
      margin-bottom: 12px;
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    .color-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .color-picker-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      background: none;
    }

    .range-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    input[type="range"] {
      flex: 1;
    }

    .actions {
      padding: 20px;
      border-top: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .actions-row {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-primary {
      background: #00e5ff;
      color: #000;
    }

    .btn-primary:hover {
      background: #33ecff;
    }

    .btn-secondary {
      background: #222733;
      color: #fff;
    }

    .btn-secondary:hover {
      background: #2d3444;
    }

    .btn-accent {
      background: #ff007f;
      color: #fff;
    }

    .btn-accent:hover {
      background: #ff3399;
    }

    #workspace {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: #050608;
      overflow: auto;
    }

    .svg-container {
      box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 0 2px #222733;
      max-height: 90vh;
      max-width: 90vw;
      aspect-ratio: 1 / 1.5;
      background: #161618;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <!-- CONTROL PANEL -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h1>Making Time 17 Generator</h1>
    </div>

    <div class="sidebar-content">
      
      <!-- Presets & Colors -->
      <div class="control-group">
        <h3>1. Chromatic Palettes</h3>
        <div class="preset-grid">
          <button class="btn-preset" id="preset-cyber">Acid Neon</button>
          <button class="btn-preset" id="preset-mono">Monochrome</button>
          <button class="btn-preset" id="preset-sunset">Sunset</button>
        </div>

        <div class="color-row">
          <div class="color-picker-wrapper">
            <input type="color" id="bg-color" value="#161618">
            <label for="bg-color">Background</label>
          </div>
          <div class="color-picker-wrapper">
            <input type="color" id="blob-fill-color" value="#d3cce3">
            <label for="blob-fill-color">Blob Tone</label>
          </div>
        </div>
        <div class="color-row">
          <div class="color-picker-wrapper">
            <input type="color" id="blob-stroke-color" value="#000000">
            <label for="blob-stroke-color">Outline</label>
          </div>
          <div class="color-picker-wrapper">
            <input type="color" id="text-color" value="#ffffff">
            <label for="text-color">Main Text</label>
          </div>
        </div>
      </div>

      <!-- Typography -->
      <div class="control-group">
        <h3>2. Text & Font Pairing</h3>
        
        <label for="font-preset-select">Font Family Preset</label>
        <select id="font-preset-select">
          <option value="avant">Avant-Garde (Foldit + Cormorant)</option>
          <option value="techno">Brutalist Techno (Syne Mono + Space Mono)</option>
          <option value="editorial">Editorial Serif (Cormorant + Space Mono)</option>
        </select>

        <label for="title-text">Left Vertical Title</label>
        <input type="text" id="title-text" value="MAKING TIME 17">

        <label for="subtitle-text">Top Subtitle</label>
        <input type="text" id="subtitle-text" value="seventeen years">

        <label for="date-text">Date Block</label>
        <textarea id="date-text">saturday&#10;may 20&#10;2017&#10;9 PM - 3 AM</textarea>

        <label for="lineup-text">Lineup</label>
        <textarea id="lineup-text">Jessy Lanza LIVE&#10;Red Axes LIVE&#10;Jacques Greene&#10;Dave P. Mike Z.&#10;Dave Pak. Broadzilla&#10;Rocktits! Greg D.&#10;&amp; Nadia Ksabia&#10;NTS / PHANTASY</textarea>

        <label for="venue-text">Venue Details</label>
        <textarea id="venue-text" style="min-height:50px;">Underground Arts&#10;1200 Callowhill st&#10;PHILADELPHIA PA&#10;15 dollars</textarea>

        <label for="tech-text">Badges & Footer</label>
        <input type="text" id="tech-text" value="BITBY.TV | | WWW.MAKINGTIMEISRAD.COM">
      </div>

      <!-- Geometry -->
      <div class="control-group">
        <h3>3. Geometry & Scale</h3>
        <label for="rose-scale">Archive Specimen Scale</label>
        <div class="range-wrapper">
          <input type="range" id="rose-scale" min="0.5" max="1.5" step="0.05" value="0.95">
        </div>
      </div>

    </div>

    <div class="actions">
      <div class="actions-row">
        <button class="btn-accent" id="randomize-btn">Randomize All</button>
        <button class="btn-secondary" id="reset-btn">Reset</button>
      </div>
      <button class="btn-primary" id="export-pdf-btn">Export Vector PDF</button>
    </div>
  </aside>

  <!-- CANVAS / WORKSPACE -->
  <main id="workspace">
    <div class="svg-container">
      <svg id="poster-svg" viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <style>
            @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&amp;family=Foldit:wght@400;700&amp;family=Space+Mono:ital,wght@0,400;0,700;1,400&amp;family=Syne+Mono&amp;display=swap');
            
            .font-title-dynamic { font-family: 'Foldit', display; font-weight: 700; }
            .font-body-dynamic { font-style: italic; font-weight: 300; }
            .font-badge-dynamic { font-family: 'Syne Mono', monospace; }
          </style>

          <radialGradient id="specimen-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ff007f" stop-opacity="0.9" />
            <stop offset="60%" stop-color="#990044" stop-opacity="0.6" />
            <stop offset="100%" stop-color="#12061a" stop-opacity="0" />
          </radialGradient>

          <radialGradient id="blob-lighting" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
            <stop offset="70%" stop-color="#000000" stop-opacity="0.1" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
          </radialGradient>

          <!-- Specimen 1: Neon Orchid -->
          <g id="specimen-rose">
            <circle cx="0" cy="0" r="140" fill="url(#specimen-glow)" />
            <line x1="-150" y1="0" x2="150" y2="0" stroke="#bfff00" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.6" />
            <line x1="0" y1="-150" x2="0" y2="150" stroke="#bfff00" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.6" />
            <g fill="none" stroke="#ff77bb" stroke-width="2.5" opacity="0.85">
              <ellipse cx="0" cy="0" rx="30" ry="70" transform="rotate(0)" />
              <ellipse cx="0" cy="0" rx="30" ry="70" transform="rotate(60)" />
              <ellipse cx="0" cy="0" rx="30" ry="70" transform="rotate(120)" />

              <ellipse cx="0" cy="0" rx="45" ry="90" transform="rotate(90)" stroke="#ff007f" stroke-width="1.5" />

          </g>

          <!-- Specimen 2: Spore Matrix Fern -->
          <g id="specimen-fern">
            <circle cx="0" cy="0" r="140" fill="url(#specimen-glow)" />
            <line x1="-150" y1="0" x2="150" y2="0" stroke="#00e5ff" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.6" />
            <line x1="0" y1="-150" x2="0" y2="150" stroke="#00e5ff" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.6" />
            <g fill="none" stroke="#00e5ff" stroke-width="2.2" opacity="0.9">
              <path d="M0,80 Q -60,20 -30,-40 Q -10,-80 0,-110 Q 10,-80 30,-40 Q 60,20 0,80" />
              <path d="M-80,0 Q -40,-40 0,-50 Q 40,-40 80,0 Q 40,40 0,50 Q -40,40 -80,0" stroke="#79ffff" stroke-width="1.5" />
            </g>
            <circle cx="0" cy="0" r="14" fill="#00e5ff" />
            <circle cx="0" cy="0" r="6" fill="#ffffff" />
          </g>

          <!-- Specimen 3: Cybernetic Lotus -->
          <g id="specimen-lotus">
            <circle cx="0" cy="0" r="140" fill="url(#specimen-glow)" />
            <line x1="-150" y1="0" x2="150" y2="0" stroke="#ffaa00" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.6" />
            <line x1="0" y1="-150" x2="0" y2="150" stroke="#ffaa00" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.6" />
            <g fill="none" stroke="#ffaa00" stroke-width="2.2" opacity="0.9">
              <polygon points="0,-85 65,-30 50,55 -50,55 -65,-30" />
              <polygon points="0,-60 45,-20 35,35 -35,35 -45,-20" stroke="#ffdd55" stroke-width="1.5" />
              <polygon points="0,-35 25,-10 20,20 -20,20 -25,-10" fill="#ffaa00" opacity="0.5" />
            </g>
            <circle cx="0" cy="0" r="12" fill="#ffffff" />
          </g>

          <!-- Specimen 4: Astral Blossom -->
          <g id="specimen-blossom">
            <circle cx="0" cy="0" r="140" fill="url(#specimen-glow)" />
            <line x1="-150" y1="0" x2="150" y2="0" stroke="#cc44ff" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.6" />
            <line x1="0" y1="-150" x2="0" y2="150" stroke="#cc44ff" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.6" />
            <g stroke="#cc44ff" stroke-width="2.2" fill="none" opacity="0.9">
              <line x1="0" y1="-90" x2="0" y2="-30" />
              <line x1="64" y1="-64" x2="21" y2="-21" />
              <line x1="90" y1="0" x2="30" y2="0" />
              <line x1="64" y1="64" x2="21" y2="21" />
              <line x1="0" y1="90" x2="0" y2="30" />
              <line x1="-64" y1="64" x2="-21" y2="21" />
              <line x1="-90" y1="0" x2="-30" y2="0" />
              <line x1="-64" y1="-64" x2="-21" y2="-21" />
            </g>
            <circle cx="0" cy="0" r="40" fill="none" stroke="#cc44ff" stroke-width="1.5" stroke-dasharray="4,4" />

        </defs>

        <!-- 1. Background Layer -->
        <g id="layer-background">
          <rect id="svg-bg" width="600" height="900" fill="#161618" />
          <g stroke="#ffffff" stroke-width="0.5" opacity="0.15">
            <line x1="20" y1="20" x2="40" y2="20" />

          <g><circle class="blob-path" cx="160" cy="380" r="35" fill="#d3cce3" stroke="#000000" stroke-width="1.5" /><circle cx="160" cy="380" r="35" fill="url(#blob-lighting)" pointer-events="none" /></g>
          <g><circle class="blob-path" cx="410" cy="460" r="28" fill="#d3cce3" stroke="#000000" stroke-width="1.5" /><circle cx="410" cy="460" r="28" fill="url(#blob-lighting)" pointer-events="none" /></g>
          <g><circle class="blob-path" cx="150" cy="560" r="24" fill="#d3cce3" stroke="#000000" stroke-width="1.5" /><circle cx="150" cy="560" r="24" fill="url(#blob-lighting)" pointer-events="none" /></g>
          <g><circle class="blob-path" cx="430" cy="730" r="30" fill="#d3cce3" stroke="#000000" stroke-width="1.5" /><circle cx="430" cy="730" r="30" fill="url(#blob-lighting)" pointer-events="none" /></g>
          <g><circle class="blob-path" cx="170" cy="820" r="26" fill="#d3cce3" stroke="#000000" stroke-width="1.5" /><circle cx="170" cy="820" r="26" fill="url(#blob-lighting)" pointer-events="none" /></g>

          <g id="svg-combined-group" transform="translate(540, 550)" class="font-body-dynamic" font-size="16" fill="#ffffff" text-anchor="end"></g>

        </g>
      </svg>
    </div>
  </main>

  <script>
    const bgColorInput = document.getElementById('bg-color');
    const blobFillInput = document.getElementById('blob-fill-color');
    const blobStrokeInput = document.getElementById('blob-stroke-color');
    const textColorInput = document.getElementById('text-color');

    const fontPresetSelect = document.getElementById('font-preset-select');
    const titleInput = document.getElementById('title-text');
    const subtitleInput = document.getElementById('subtitle-text');
    const dateInput = document.getElementById('date-text');
    const lineupInput = document.getElementById('lineup-text');
    const venueInput = document.getElementById('venue-text');
    const techInput = document.getElementById('tech-text');

    const roseScaleInput = document.getElementById('rose-scale');
    const resetBtn = document.getElementById('reset-btn');
    const randomizeBtn = document.getElementById('randomize-btn');
    const exportPdfBtn = document.getElementById('export-pdf-btn');

    const presetCyber = document.getElementById('preset-cyber');
    const presetMono = document.getElementById('preset-mono');
    const presetSunset = document.getElementById('preset-sunset');

    const svgBg = document.getElementById('svg-bg');
    const blobPaths = document.querySelectorAll('.blob-path');

    const svgRoseContainer = document.getElementById('svg-rose-container');
    const specimenUse = document.getElementById('specimen-use');
    const specimenLabelNum = document.getElementById('specimen-label-num');
    const specimenLabelName = document.getElementById('specimen-label-name');

    const svgTitle = document.getElementById('svg-title');
    const svgSubtitle = document.getElementById('svg-subtitle');
    const subTextElements = document.querySelectorAll('.sub-text-el');
    const svgDateGroup = document.getElementById('svg-date-group');
    const svgCombinedGroup = document.getElementById('svg-combined-group');
    const svgBadge1 = document.getElementById('svg-badge-1');
    const svgFooter = document.getElementById('svg-footer');

    const fontTitleDynamic = document.querySelectorAll('.font-title-dynamic');
    const fontBodyDynamic = document.querySelectorAll('.font-body-dynamic');
    const fontBadgeDynamic = document.querySelectorAll('.font-badge-dynamic');

    const specimens = [
      { id: '#specimen-rose', num: 'Specimen 17: Neon Orchid', name: 'DIGITAL BOTANICAL SPECIMEN' },
      { id: '#specimen-fern', num: 'Specimen 42: Spore Matrix Fern', name: 'PTERIDOPHYTE ARCHIVE' },
      { id: '#specimen-lotus', num: 'Specimen 88: Cybernetic Lotus', name: 'CRYSTALLINE FLORA ARCHIVE' },
      { id: '#specimen-blossom', num: 'Specimen 09: Astral Blossom', name: 'POLYGONAL FLOWER ARCHIVE' }
    ];

    function updatePoster() {
      svgBg.setAttribute('fill', bgColorInput.value);
      
      const fillCol = blobFillInput.value;
      const strokeCol = blobStrokeInput.value;
      blobPaths.forEach(path => {
        path.setAttribute('fill', fillCol);
        path.setAttribute('stroke', strokeCol);
      });

      const textCol = textColorInput.value;
      svgTitle.setAttribute('fill', textCol);
      svgSubtitle.setAttribute('fill', textCol);
      subTextElements.forEach(el => el.setAttribute('fill', textCol));
      svgBadge1.setAttribute('fill', textCol);
      svgFooter.setAttribute('fill', textCol);

      svgTitle.textContent = titleInput.value;
      svgSubtitle.textContent = subtitleInput.value;

      svgDateGroup.innerHTML = '';
      dateInput.value.split('\n').forEach((line, index) => {
        const tspan = document.createElementNS("http://www.w3.org/2000/svg", "text");
        tspan.textContent = line;
        tspan.setAttribute("x", "0");
        tspan.setAttribute("y", index * 22);
        tspan.setAttribute("text-anchor", "middle");
        tspan.setAttribute("fill", textCol);
        tspan.setAttribute("class", "font-body-dynamic");
        svgDateGroup.appendChild(tspan);
      });

      svgCombinedGroup.innerHTML = '';
      const lineupLines = lineupInput.value.split('\n');
      const venueLines = venueInput.value.split('\n');
      
      let currentY = 0;
      const lineGap = 20;

      lineupLines.forEach(line => {
        const tspan = document.createElementNS("http://www.w3.org/2000/svg", "text");
        tspan.textContent = line;
        tspan.setAttribute("x", "0");
        tspan.setAttribute("y", currentY);
        tspan.setAttribute("text-anchor", "end");
        tspan.setAttribute("fill", textCol);
        tspan.setAttribute("class", "font-body-dynamic");
        svgCombinedGroup.appendChild(tspan);
        currentY += lineGap;
      });

      currentY += 16; 

      venueLines.forEach(line => {
        const tspan = document.createElementNS("http://www.w3.org/2000/svg", "text");
        tspan.textContent = line;
        tspan.setAttribute("x", "0");
        tspan.setAttribute("y", currentY);
        tspan.setAttribute("text-anchor", "end");
        tspan.setAttribute("fill", textCol);
        tspan.setAttribute("class", "font-body-dynamic");
        svgCombinedGroup.appendChild(tspan);
        currentY += 18;
      });

      const techParts = techInput.value.split('|');
      svgBadge1.textContent = techParts[0] ? techParts[0].trim() : '';
      svgFooter.textContent = techParts[2] ? techParts[2].trim() : '';

      const scale = roseScaleInput.value;
      svgRoseContainer.setAttribute('transform', `translate(260, 290) scale(${scale})`);
    }

    function applyFontPreset(preset) {
      let titleFont = "'Foldit', display";
      let bodyFont = "'Cormorant Garamond', serif";

      if (preset === 'techno') {
        titleFont = "'Syne Mono', monospace";
        bodyFont = "'Space Mono', monospace";
      } else if (preset === 'editorial') {
        titleFont = "'Cormorant Garamond', serif";
        bodyFont = "'Space Mono', monospace";
      } else if (preset === 'avant') {
        titleFont = "'Foldit', display";
        bodyFont = "'Cormorant Garamond', serif";
      }

      fontTitleDynamic.forEach(el => { el.style.fontFamily = titleFont; });
      fontBodyDynamic.forEach(el => { el.style.fontFamily = bodyFont; });
    }

    fontPresetSelect.addEventListener('change', (e) => applyFontPreset(e.target.value));

    function applyTheme(bg, fill, stroke, text) {
      bgColorInput.value = bg;
      blobFillInput.value = fill;
      blobStrokeInput.value = stroke;
      textColorInput.value = text;
      updatePoster();
    }

    presetCyber.addEventListener('click', () => applyTheme('#050505', '#bfff00', '#000000', '#ff007f'));
    presetMono.addEventListener('click', () => applyTheme('#1e1e1e', '#ffffff', '#000000', '#ffffff'));
    presetSunset.addEventListener('click', () => applyTheme('#120826', '#ff5500', '#120826', '#00e5ff'));

    function getRandomColor(isBackground = false) {
      const letters = '0123456789ABCDEF';
      if (isBackground) {
        let color = '#';
        for (let i = 0; i < 3; i++) {
          color += letters[Math.floor(Math.random() * 4)];
        }
        return color;
      } else {
        let color = '#';
        for (let i = 0; i < 6; i++) {
          color += letters[Math.floor(Math.random() * 6) + 10];
        }
        return color;
      }
    }

    function randomizePoster() {
      bgColorInput.value = getRandomColor(true);
      blobFillInput.value = getRandomColor(false);
      blobStrokeInput.value = Math.random() > 0.5 ? '#000000' : '#ffffff';
      textColorInput.value = '#ffffff';

      const randomScale = (Math.random() * 0.5 + 0.65).toFixed(2);
      roseScaleInput.value = randomScale;

      const chosenSpecimen = specimens[Math.floor(Math.random() * specimens.length)];
      specimenUse.setAttribute('href', chosenSpecimen.id);
      specimenLabelNum.textContent = chosenSpecimen.num;
      specimenLabelName.textContent = chosenSpecimen.name;

      blobPaths.forEach((circle) => {
        const randomXOffset = (Math.random() * 80 - 40).toFixed(1);
        const randomYOffset = (Math.random() * 80 - 40).toFixed(1);
        const randomScaleCircle = (Math.random() * 0.5 + 0.75).toFixed(2);
        
        circle.style.opacity = Math.random() > 0.15 ? '0.9' : '0.4';
        circle.setAttribute('transform', `translate(${randomXOffset}, ${randomYOffset}) scale(${randomScaleCircle})`);
      });

      const fontPresets = ['avant', 'techno', 'editorial'];
      const chosenPreset = fontPresets[Math.floor(Math.random() * fontPresets.length)];
      fontPresetSelect.value = chosenPreset;
      applyFontPreset(chosenPreset);

      updatePoster();
    }

    function resetDefaults() {
      bgColorInput.value = '#161618';
      blobFillInput.value = '#d3cce3';
      blobStrokeInput.value = '#000000';
      textColorInput.value = '#ffffff';
      roseScaleInput.value = '0.95';
      fontPresetSelect.value = 'avant';
      applyFontPreset('avant');
      
      specimenUse.setAttribute('href', '#specimen-rose');
      specimenLabelNum.textContent = 'Specimen 17: Neon Orchid';
      specimenLabelName.textContent = 'DIGITAL BOTANICAL SPECIMEN';

      blobPaths.forEach(circle => {
        circle.style.opacity = '1';
        circle.removeAttribute('transform');
      });
      updatePoster();
    }

    async function exportPDF() {
      const { jsPDF } = window.jspdf;
      const svgElement = document.getElementById('poster-svg');

      try {
        const doc = new jsPDF({
          orientation: 'portrait',
          unit: 'pt',
          format: [600, 900]
        });

        await doc.svg(svgElement, {
          x: 0,
          y: 0,
          width: 600,
          height: 900,
          loadExternalResources: true
        });

        doc.save(`making_time_17_specimen_${Date.now()}.pdf`);
      } catch (error) {
        console.error("PDF Export failed:", error);
        alert("Failed to generate PDF. Check console for details.");
      }
    }

    const inputs = [
      bgColorInput, blobFillInput, blobStrokeInput, textColorInput,
      titleInput, subtitleInput, dateInput, lineupInput, venueInput, techInput,
      roseScaleInput
    ];

    inputs.forEach(input => input.addEventListener('input', updatePoster));
    resetBtn.addEventListener('click', resetDefaults);
    randomizeBtn.addEventListener('click', randomizePoster);
    exportPdfBtn.addEventListener('click', exportPDF);

    updatePoster();
  </script>
</body>
</html>
